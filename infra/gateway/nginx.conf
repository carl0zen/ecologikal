worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 32m;

  upstream vintage {
    server vintage:80;
  }

  upstream revival {
    server web:3100;
  }

  server {
    listen 80;
    server_name _;

    # Revival Next.js UI under /v2
    location /v2 {
      proxy_pass http://revival;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Eco Nextcloud is published on host :8081 (compose profile nc).
    # Do not proxy /nc here — upstream DNS fails in dual:up:lite.

    # Vintage PHP is the default site
    location / {
      proxy_pass http://vintage;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
